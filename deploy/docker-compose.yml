# Run from the repository root:  docker compose -f deploy/docker-compose.yml up -d
#
# Nothing in this file contains a secret. The database password is read from
# deploy/.env (gitignored; see deploy/.env.example) and interpolated below; the
# exchange key and the session secret come from app/server/.env at runtime.
# Neither file enters an image.

name: btc-desk

services:
  # The desk's database: trades, strategies, settings, sign-in, the error log,
  # open-interest history and the analytics tables -- one PostgreSQL, one schema
  # each (docs/DB-INVENTORY.md). No host port: only the containers on this
  # network can reach it. Its data is its own volume, backed up by
  # deploy/backup-db.sh; chain.db stays a file on the `data` volume.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: btc_desk
      POSTGRES_USER: desk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env (openssl rand -base64 24)}
      # Checksums catch a disk that lies. Cheap, and this is an order journal.
      POSTGRES_INITDB_ARGS: --data-checksums
    command:
      # A desk this size: a handful of connections, small tables. Modest memory,
      # and a WAL kept long enough for a backup to be consistent.
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=40
      - -c
      - log_min_duration_statement=500ms
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desk -d btc_desk -q"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: btc-desk-api:${TAG:-latest}
    restart: unless-stopped
    env_file:
      # optional; the desk runs fully on public market data without it
      - path: ../app/server/.env
        required: false
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8787
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The one SQLite file left: the harvester's read-only chain dataset.
      CHAIN_DB: /srv/data/chain.db
      # Everything the desk writes -- the order journal above all, which is how
      # a restart knows a position exists before it has spoken to the exchange.
      DATABASE_URL: postgres://desk:${POSTGRES_PASSWORD}@db:5432/btc_desk
      # Room for the heap to grow before V8 starts collecting hard. The desk
      # rests near 100 MB; this is headroom, not a need.
      NODE_OPTIONS: --max-old-space-size=1536
      # Display-only models. Deliberately not a `depends_on`: the desk trades and
      # serves its own cards whether or not this answers.
      ANALYTICS_URL: http://analytics:8800
    volumes:
      # chain.db, and the retired SQLite files kept as the rollback path after
      # the cutover (docs/DEPLOY.md).
      - data:/srv/data
    # No host port. The browser reaches the API through the web container over
    # the compose network, so nothing on the host can talk to it directly.
    # To poke at it while debugging:
    #   docker compose exec api node -e "fetch('http://127.0.0.1:8787/api/health').then(r=>r.text()).then(console.log)"
    expose:
      - "8787"
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Ceilings, not reservations. This host (4 cores, 8 GB) runs only the desk
    # and its edge proxy, so the API may use most of it when it needs to -- a
    # cold chain fan-out or a burst of polls -- without being throttled at one
    # core. The old 1 CPU / 512 MB was sized for a shared box.
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 2G
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Display-only models (Python): Down / Side / Up measured, and later the other
  # analytics the screens read. Nothing on the trading path calls it, and the
  # API falls back to its own figures when it is away.
  analytics:
    build:
      context: ..
      dockerfile: Dockerfile.analytics
    image: btc-desk-analytics:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The `analytics` schema of the desk's database, written by
      # research/publish_outlook_states.py. See docs/ANALYTICS.md.
      DATABASE_URL: postgres://desk:${POSTGRES_PASSWORD}@db:5432/btc_desk
    expose:
      - "8800"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
    image: btc-desk-web:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # WEB_BIND=127.0.0.1 when a reverse proxy on this host is the only thing
    # that should reach it: a port Docker publishes on 0.0.0.0 is open to the
    # internet whatever ufw says, because Docker writes its own iptables rules
    # ahead of ufw's.
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8099}:80"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # One-shot: tops the chain cache up with any day it is missing, then exits.
  # Schedule it from cron or a systemd timer after the 12:00 UTC settlement.
  harvester:
    build:
      context: ..
      dockerfile: Dockerfile.harvester
    image: btc-desk-harvester:${TAG:-latest}
    profiles: ["ops"]
    environment:
      CHAIN_DB: /srv/data/chain.db
    volumes:
      - data:/srv/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  # chain.db and the retired SQLite files
  data:
  # PostgreSQL's data directory
  pgdata:
