# Static front end plus a proxy to the API container. TLS terminates in front
# of this (host nginx or your load balancer), so no certificates live here.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers, and a trap worth knowing: nginx only inherits add_header
    # into a location that has NO add_header of its own. Every location below
    # sets Cache-Control, so for years these server-level lines reached only
    # /api/ -- the page itself went out with no X-Frame-Options, and could be
    # framed. Each location with its own add_header repeats them, via the
    # snippet lines marked SECURITY.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # ---- compression ----
    # The chain response is ~68 KB of JSON; gzip brings it under 10 KB.
    # Applied here rather than in Node.js: nginx handles it faster and the
    # trading server stays focused on orders.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/html
        image/svg+xml;

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # vite emits content-hashed filenames, so these can be cached hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # SECURITY (repeated: see the note at the top)
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    }

    location /api/ {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # a cold historical chain fans out to dozens of upstream calls
        proxy_read_timeout 120s;
    }

    # index.html must never be cached. The asset filenames carry a content hash
    # and can be cached forever, but if the browser holds an old index.html it
    # keeps loading the old bundle and a deploy silently does nothing.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        # SECURITY (repeated: see the note at the top)
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        # SECURITY (repeated: see the note at the top)
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
