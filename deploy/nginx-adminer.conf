# Canonical copy of the edge vhost for adminer.thannigo.in -- the BTC desk's
# database console. Read docs/ADMINER.md first.
#
# DEPLOYED ARTEFACT: /home/agent/trade/infra/nginx/btc-adminer.conf.template
#
#   install -m 644 deploy/nginx-adminer.conf \
#       /home/agent/trade/infra/nginx/btc-adminer.conf.template
#   docker exec banknifty-proxy-1 sh -c 'envsubst "$NGINX_ENVSUBST_FILTER" \
#       < /etc/nginx/templates/btc-adminer.conf.template > /etc/nginx/conf.d/btc-adminer.conf'
#   docker exec banknifty-proxy-1 nginx -t
#   docker exec banknifty-proxy-1 nginx -s reload
#
# The same rules as deploy/nginx.conf, for the same reasons: served by
# banknifty-proxy-1 (nginx 1.27), `http2 on;`, a LITERAL upstream on
# host.docker.internal, and no ${...} placeholders (the proxy's envsubst filter
# would leave them as literals and break the config).
#
# The literal upstream means nginx resolves it once at load, and the address
# is the docker bridge, which always exists -- so this file loads whether or not
# Adminer is running. With Adminer stopped (its normal state: it is opt-in) the
# name answers 502 behind the password, which is the right blast radius.
#
# What is in front of the console, outermost first:
#   1. TLS, HSTS, no indexing, no framing.
#   2. HTTP basic auth, its own file (not banknifty's), bcrypt.
#   3. A rate limit on the login POST, because Adminer checks the database
#      password before its own one-time code, so without this the form is an
#      unlimited password oracle for anyone past step 2.
#   4. In Adminer: the one-time code, the pinned server, the read-only role.
#
# Optional, and recommended if your addresses are stable: an allow-list. Put
# your IPs in, uncomment, reload; everyone else gets 403 before the password.

# Only POSTs get a key; a request with an empty key is never limited. So a login
# attempt (and any other form post, a SQL query included) is held to 10 a minute per address, and
# browsing tables is not throttled at all.
map $request_method $btc_adminer_post_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $btc_adminer_post_key zone=btc_adminer_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name adminer.thannigo.in;

    # certbot renews over HTTP-01 from the webroot; never redirect this.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name adminer.thannigo.in;

    ssl_certificate     /etc/letsencrypt/live/adminer.thannigo.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adminer.thannigo.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    # Adminer sends X-Frame-Options and a CSP of its own; these are the ones it
    # cannot know to send from behind a proxy.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    # Imports through the console are not how data gets into this desk.
    client_max_body_size 2m;

    # allow 203.0.113.10;     # home
    # allow 198.51.100.0/24;  # office
    # deny  all;

    auth_basic           "BTC desk database";
    auth_basic_user_file /etc/nginx/templates/.htpasswd-btc-adminer;

    location / {
        limit_req zone=btc_adminer_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://host.docker.internal:8098;
        # With Adminer stopped (its normal state) nothing answers on the bridge
        # port and the connect hangs rather than being refused; without this the
        # page spins for a minute before its 502.
        proxy_connect_timeout 3s;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Adminer never needs longer than the role's own 30 s statement limit.
        proxy_read_timeout 45s;
    }
}
