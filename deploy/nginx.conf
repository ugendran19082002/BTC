# Canonical copy of the edge vhost for delta.thannigo.in.
#
# DEPLOYED ARTEFACT: /home/agent/trade/infra/nginx/delta.conf.template
#
#   install -m 644 deploy/nginx.conf \
#       /home/agent/trade/infra/nginx/delta.conf.template
#   docker exec banknifty-proxy-1 sh -c 'envsubst "$NGINX_ENVSUBST_FILTER" \
#       < /etc/nginx/templates/delta.conf.template > /etc/nginx/conf.d/delta.conf'
#   docker exec banknifty-proxy-1 nginx -t
#   docker exec banknifty-proxy-1 nginx -s reload
#
# Read this before editing
# ------------------------
# An earlier version of this file targeted the HOST nginx at
# /etc/nginx/sites-available/delta.thannigo.in. That is not where this site is
# served from. Ports 80 and 443 are owned by `banknifty-proxy-1`
# (nginx 1.27-alpine, the banknifty compose project); the host nginx is
# installed but INACTIVE. So the file was correct in content, installed in a
# place nothing reads, and the site stayed broken with a valid certificate
# sitting unused on disk.
#
# Two consequences of that, both load-bearing:
#
#   * `http2 on;` is used, not the deprecated `listen ... http2` form. That form
#     was here because the host nginx is 1.18; the proxy that actually serves
#     this is 1.27, where `http2 on;` is correct.
#   * The upstream is host.docker.internal:8099, not 127.0.0.1:8099. From
#     inside the proxy container 127.0.0.1 is the container itself. The proxy
#     is started with extra_hosts host.docker.internal:host-gateway.
#
# Do not add ${...} placeholders. The proxy sets NGINX_ENVSUBST_FILTER to
# ^(PUBLIC_DOMAIN|EXTRA_DOMAINS|CERT_NAME)$, so any other ${VAR} survives
# envsubst as a literal and breaks the config. nginx's own $host and
# $remote_addr pass through untouched, which is why that filter exists.

server {
    listen 80;
    listen [::]:80;
    server_name delta.thannigo.in;

    # Must stay on plain HTTP and above the redirect: certbot renews this cert
    # through here over HTTP-01, from the webroot the proxy bind-mounts at
    # /var/www/certbot. Redirecting it breaks renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name delta.thannigo.in;

    ssl_certificate     /etc/letsencrypt/live/delta.thannigo.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/delta.thannigo.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # HSTS is asserted HERE and nowhere else: the web container terminates
    # plain HTTP and cannot know the request arrived over TLS. The other three
    # security headers (X-Frame-Options, X-Content-Type-Options,
    # Referrer-Policy) are already sent by the app's own nginx — see
    # deploy/nginx.docker.conf — and repeating them here would emit each twice,
    # which is the duplicate-header bug Cache-Control already hit on this stack.
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;

    # This desk shows your positions and your sizing. If it is only for you,
    # uncomment these two lines and create the file with:
    #   htpasswd -c /home/agent/trade/proxy/.htpasswd-delta <username>
    # and mount it into the proxy alongside the existing .htpasswd.
    # auth_basic           "delta desk";
    # auth_basic_user_file /etc/nginx/.htpasswd-delta;

    location / {
        # A LITERAL upstream host, never a variable. With a variable nginx
        # defers resolution to request time and consults `resolver`, which
        # never reads /etc/hosts, so every request 502s with "no resolver
        # defined to resolve host.docker.internal". A literal is resolved once
        # at config load, which does read /etc/hosts and so sees extra_hosts.
        proxy_pass http://host.docker.internal:8099;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A cold historical chain fans out to dozens of upstream exchange
        # calls; the default 60s cuts it off mid-flight.
        proxy_read_timeout 120s;
    }
}
