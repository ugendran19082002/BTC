# /etc/nginx/sites-available/delta.thannigo.in
#
# Front end is a static build; /api is proxied to the Fastify process on
# localhost. The API is never exposed directly on a public port.

server {
    listen 80;
    server_name delta.thannigo.in;
    # certbot rewrites this block to redirect to 443 when TLS is issued
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name delta.thannigo.in;

    ssl_certificate     /etc/letsencrypt/live/delta.thannigo.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/delta.thannigo.in/privkey.pem;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    root /srv/btc-desk/app/web/dist;
    index index.html;

    # hashed asset filenames, so they can be cached hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # a cold historical chain fans out to dozens of upstream calls
        proxy_read_timeout 120s;
    }

    location / { try_files $uri $uri/ /index.html; }
}
