# /etc/nginx/sites-available/delta.thannigo.in
#
# Host-level reverse proxy in front of the Docker stack. The compose file
# publishes the web container on 127.0.0.1:8099; nothing else is exposed.
#
# Why this file exists: the host already terminates TLS for other names on this
# box. Without a 443 server block naming delta.thannigo.in, nginx falls through
# to its default HTTPS site and serves that site's certificate, which is what
# produces ERR_CERT_COMMON_NAME_INVALID in the browser.

server {
    listen 80;
    listen [::]:80;
    server_name delta.thannigo.in;

    # certbot writes its challenge here; keep it above the redirect
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                       # nginx >= 1.25 syntax; the old `listen ... http2` is deprecated
    server_name delta.thannigo.in;

    ssl_certificate     /etc/letsencrypt/live/delta.thannigo.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/delta.thannigo.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # This desk shows your positions and your sizing. If it is only for you,
    # uncomment these two lines and create the file with:
    #   htpasswd -c /etc/nginx/.htpasswd-delta <username>
    # auth_basic           "delta desk";
    # auth_basic_user_file /etc/nginx/.htpasswd-delta;

    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # a cold historical chain fans out to dozens of upstream calls
        proxy_read_timeout 120s;
    }
}
